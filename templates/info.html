<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Просмотр записи - TeachApp</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        MathJax = {
            tex: {
                inlineMath: [['\\(', '\\)']],
                displayMath: [['\\[', '\\]']]
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js" async></script>
    <style>
        @media (max-width: 768px) {
            nav .desktop-nav {
                display: flex;
                overflow-x: auto;
                -webkit-overflow-scrolling: touch;
                white-space: nowrap;
            }

            nav .desktop-nav a {
                flex-shrink: 0;
            }
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
        }
        .info-content {
            word-wrap: break-word;
            overflow-wrap: break-word;
            white-space: pre-wrap;
        }
        mjx-container {
            overflow-x: auto;
            overflow-y: hidden;
        }
    </style>
</head>
<body>
    <!-- Навигация -->
    <nav class="bg-white border-b border-gray-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4">
            <div class="flex justify-between h-14">
                <div class="flex items-center">
                    <svg class="h-6 w-6 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/>
                    </svg>
                    <span class="ml-2 text-lg font-semibold text-gray-900">TeachApp</span>
                </div>
                <div class="flex items-center space-x-1">
                    <a href="/information" class="text-gray-600 hover:text-gray-900 px-3 py-2 rounded-md text-sm font-medium flex items-center">
                        <svg class="h-4 w-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
                        </svg>
                        Назад
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto py-6 px-4">
        <div id="infoContent" class="bg-white border border-gray-200 rounded-lg p-4 sm:p-6">
            <!-- Информация будет загружена через JavaScript -->
        </div>
    </main>

    <script>
        async function loadInfo() {
            const name = window.location.pathname.split('/').pop();

            try {
                const response = await fetch('/api/informations');
                const informations = await response.json();
                const info = informations.find(item => item.name === decodeURIComponent(name));

                if (info) {
                    document.title = info.name + ' - TeachApp';

                    const infoContent = document.getElementById('infoContent');

                    infoContent.innerHTML = `
                        <div class="mb-4">
                            <span class="text-xs font-medium text-blue-600 bg-blue-50 px-2 py-1 rounded">${info.subject || 'Без предмета'}</span>
                        </div>
                        <h1 class="text-2xl font-bold text-gray-900 mb-4">${info.name}</h1>
                        <div class="info-content text-gray-700" style="${info.css || ''}">${info.text || ''}</div>
                    `;

                    // Рендерим формулы MathJax
                    if (window.MathJax) {
                        await MathJax.typesetPromise([infoContent]);
                    }
                } else {
                    document.getElementById('infoContent').innerHTML = `
                        <p class="text-gray-500 text-center py-8">Запись не найдена</p>
                    `;
                }
            } catch (error) {
                console.error('Error loading info:', error);
                document.getElementById('infoContent').innerHTML = `
                    <p class="text-red-500 text-center py-8">Ошибка при загрузке</p>
                `;
            }
        }

        loadInfo();
    </script>
</body>
</html>
