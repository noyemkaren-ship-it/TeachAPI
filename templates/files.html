<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Файлы - TeachApp</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .mobile-menu { display: none; }
        @media (max-width: 768px) {
            .desktop-nav { display: none; }
            .mobile-menu-btn { display: block; }
            .mobile-menu.open { display: block; }
        }
        @media (min-width: 769px) {
            .mobile-menu-btn { display: none; }
        }
    </style>
</head>
<body>
    <!-- Навигация -->
    <nav class="bg-white border-b border-gray-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4">
            <div class="flex justify-between h-14">
                <div class="flex items-center">
                    <svg class="h-6 w-6 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/>
                    </svg>
                    <span class="ml-2 text-lg font-semibold text-gray-900">TeachApp</span>
                </div>
                <div class="desktop-nav flex items-center space-x-1">
                    <a href="/" class="text-gray-600 hover:text-gray-900 px-3 py-2 rounded-md text-sm font-medium">Главная</a>
                    <a href="/books_page" class="text-gray-600 hover:text-gray-900 px-3 py-2 rounded-md text-sm font-medium">Библиотека</a>
                    <a href="/information" class="text-gray-600 hover:text-gray-900 px-3 py-2 rounded-md text-sm font-medium">Информация</a>
                    <a href="/files" class="bg-gray-100 text-gray-900 px-3 py-2 rounded-md text-sm font-medium">Файлы</a>
                    <a href="/desk" class="text-gray-600 hover:text-gray-900 px-3 py-2 rounded-md text-sm font-medium">Доска</a>
                </div>
                <button class="mobile-menu-btn p-2" onclick="toggleMobileMenu()">
                    <svg class="h-6 w-6 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
                    </svg>
                </button>
            </div>
            <div id="mobileMenu" class="mobile-menu pb-3">
                <a href="/" class="block px-3 py-2 rounded-md text-sm font-medium text-gray-600 hover:bg-gray-100">Главная</a>
                <a href="/books_page" class="block px-3 py-2 rounded-md text-sm font-medium text-gray-600 hover:bg-gray-100">Библиотека</a>
                <a href="/information" class="block px-3 py-2 rounded-md text-sm font-medium text-gray-600 hover:bg-gray-100">Информация</a>
                <a href="/files" class="block px-3 py-2 rounded-md text-sm font-medium bg-gray-100 text-gray-900">Файлы</a>
                <a href="/desk" class="block px-3 py-2 rounded-md text-sm font-medium text-gray-600 hover:bg-gray-100">Доска</a>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto py-6 px-4">
        <!-- Заголовок -->
        <div class="mb-6">
            <h1 class="text-2xl font-bold text-gray-900">Файлы</h1>
            <p class="text-gray-600 text-sm sm:text-base">Управление документами и материалами</p>
        </div>

        <!-- Зона загрузки -->
        <div class="mb-6">
            <div class="border-2 border-dashed border-gray-300 rounded-lg p-4 sm:p-8 text-center hover:border-blue-500 transition-colors" id="dropZone">
                <input type="file" id="fileInput" class="hidden" onchange="uploadFile(this.files[0])">
                <button onclick="document.getElementById('fileInput').click()" class="inline-flex items-center px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 text-sm">
                    <svg class="h-5 w-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/>
                    </svg>
                    Выбрать файл
                </button>
                <p class="text-gray-500 mt-2 text-xs sm:text-sm">или перетащите файл сюда</p>
            </div>
        </div>

        <!-- Список файлов -->
        <div class="bg-white rounded-lg border border-gray-200">
            <div class="px-4 py-3 border-b border-gray-200">
                <h2 class="text-lg font-semibold text-gray-900">Документы</h2>
            </div>
            <div id="filesList" class="divide-y divide-gray-200">
                <!-- Файлы будут загружены через JavaScript -->
            </div>
        </div>
    </main>

    <script>
        function toggleMobileMenu() {
            const menu = document.getElementById('mobileMenu');
            menu.classList.toggle('open');
        }

        async function loadFiles() {
            try {
                const response = await fetch('/files/list');
                const files = await response.json();
                displayFiles(files);
            } catch (error) {
                console.error('Error loading files:', error);
            }
        }

        function displayFiles(files) {
            const filesList = document.getElementById('filesList');
            filesList.innerHTML = '';
            files.forEach(file => {
                const fileRow = document.createElement('div');
                fileRow.className = 'flex items-center justify-between px-4 py-3 hover:bg-gray-50';
                fileRow.innerHTML = `
                    <div class="flex items-center min-w-0 flex-1">
                        <svg class="h-5 w-5 sm:h-6 sm:w-6 text-gray-400 mr-2 sm:mr-3 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z"/>
                        </svg>
                        <div class="min-w-0">
                            <p class="text-sm font-medium text-gray-900 truncate">${file.name}</p>
                            <p class="text-xs text-gray-500">${(file.size / 1024).toFixed(2)} KB</p>
                        </div>
                    </div>
                    <div class="flex items-center space-x-1 sm:space-x-3 flex-shrink-0">
                        <a href="/files/download/${file.name}" class="text-blue-600 hover:text-blue-700 p-1">
                            <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
                            </svg>
                        </a>
                        <button onclick="deleteFile('${file.name}')" class="text-gray-400 hover:text-red-600 p-1">
                            <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                            </svg>
                        </button>
                    </div>
                `;
                filesList.appendChild(fileRow);
            });
        }

        async function uploadFile(file) {
            if (!file) return;
            const formData = new FormData();
            formData.append('file', file);
            try {
                const response = await fetch('/files/upload', {
                    method: 'POST',
                    body: formData
                });
                if (response.ok) {
                    loadFiles();
                } else {
                    const error = await response.json();
                    alert('Ошибка: ' + error.detail);
                }
            } catch (error) {
                console.error('Error uploading file:', error);
                alert('Ошибка при загрузке файла');
            }
        }

        async function deleteFile(filename) {
            if (confirm('Удалить файл "' + filename + '"?')) {
                try {
                    const response = await fetch('/files/' + filename, {method: 'DELETE'});
                    if (response.ok) loadFiles();
                } catch (error) {
                    console.error('Error deleting file:', error);
                }
            }
        }

        const dropZone = document.getElementById('dropZone');
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('border-blue-500', 'bg-blue-50');
        });
        dropZone.addEventListener('dragleave', (e) => {
            e.preventDefault();
            dropZone.classList.remove('border-blue-500', 'bg-blue-50');
        });
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('border-blue-500', 'bg-blue-50');
            const files = e.dataTransfer.files;
            if (files.length > 0) uploadFile(files[0]);
        });

        loadFiles();
    </script>
</body>
</html>
