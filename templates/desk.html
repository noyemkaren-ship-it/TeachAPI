<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Онлайн доска - TeachApp</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        @media (max-width: 768px) {
            nav .desktop-nav {
                display: flex;
                overflow-x: auto;
                -webkit-overflow-scrolling: touch;
                white-space: nowrap;
            }

            nav .desktop-nav a {
                flex-shrink: 0;
            }
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            overflow: hidden;
        }
        .toolbar-btn {
            transition: all 0.2s;
            min-width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .toolbar-btn:hover {
            background-color: #f3f4f6;
        }
        .toolbar-btn.active {
            background-color: #e5e7eb;
            border-radius: 6px;
        }
        .color-btn {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.2s;
        }
        .color-btn:hover {
            transform: scale(1.1);
        }
        .color-btn.active {
            border-color: #3b82f6;
        }
        canvas {
            cursor: crosshair;
        }
    </style>
</head>
<body>
    <!-- Навигация -->
    <nav class="bg-white border-b border-gray-200 sticky top-0 z-50">
        <div class="max-w-full mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-14">
                <div class="flex items-center">
                    <svg class="h-6 w-6 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/>
                    </svg>
                    <span class="ml-2 text-lg font-semibold text-gray-900">TeachApp</span>
                </div>
                <div class="flex items-center space-x-1">
                    <a href="/" class="text-gray-600 hover:text-gray-900 px-3 py-2 rounded-md text-sm font-medium">Главная</a>
                    <a href="/books_page" class="text-gray-600 hover:text-gray-900 px-3 py-2 rounded-md text-sm font-medium">Библиотека</a>
                    <a href="/information" class="text-gray-600 hover:text-gray-900 px-3 py-2 rounded-md text-sm font-medium">Информация</a>
                    <a href="/desk" class="bg-gray-100 text-gray-900 px-3 py-2 rounded-md text-sm font-medium">Доска</a>
                    <a href="/files" class="text-gray-600 hover:text-gray-900 px-3 py-2 rounded-md text-sm font-medium">Файлы</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Панель инструментов -->
    <div class="bg-white border-b border-gray-200 px-4 py-2 flex items-center gap-2 flex-wrap">
        <!-- Инструменты -->
        <button onclick="setTool('pen')" id="penTool" class="toolbar-btn active rounded" title="Карандаш">
            <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"/>
            </svg>
        </button>
        <button onclick="setTool('eraser')" id="eraserTool" class="toolbar-btn rounded" title="Ластик">
            <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 20H7L3 16a2 2 0 010-2.828l9-9a2 2 0 012.828 0l4 4a2 2 0 010 2.828L10 20H7m0 0h13"/>
            </svg>
        </button>
        <button onclick="setTool('line')" id="lineTool" class="toolbar-btn rounded" title="Линия">
            <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 20L20 4"/>
            </svg>
        </button>
        <button onclick="setTool('rectangle')" id="rectangleTool" class="toolbar-btn rounded" title="Прямоугольник">
            <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <rect x="3" y="3" width="18" height="18" rx="2"/>
            </svg>
        </button>
        <button onclick="setTool('circle')" id="circleTool" class="toolbar-btn rounded" title="Круг">
            <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="9"/>
            </svg>
        </button>
        <button onclick="setTool('text')" id="textTool" class="toolbar-btn rounded" title="Текст">
            <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 7V4h16v3M9 20h6M12 4v16"/>
            </svg>
        </button>

        <div class="border-l border-gray-200 h-6 mx-2"></div>

        <!-- Цвета -->
        <div class="flex items-center gap-1">
            <button class="color-btn bg-black active" onclick="setColor('#000000')" title="Черный"></button>
            <button class="color-btn bg-red-500" onclick="setColor('#ef4444')" title="Красный"></button>
            <button class="color-btn bg-blue-500" onclick="setColor('#3b82f6')" title="Синий"></button>
            <button class="color-btn bg-green-500" onclick="setColor('#22c55e')" title="Зеленый"></button>
            <button class="color-btn bg-yellow-500" onclick="setColor('#eab308')" title="Желтый"></button>
            <button class="color-btn bg-purple-500" onclick="setColor('#8b5cf6')" title="Фиолетовый"></button>
            <button class="color-btn bg-orange-500" onclick="setColor('#f97316')" title="Оранжевый"></button>
            <input type="color" id="customColor" onchange="setColor(this.value)" class="w-8 h-8 cursor-pointer" title="Свой цвет">
        </div>

        <div class="border-l border-gray-200 h-6 mx-2"></div>

        <!-- Размер -->
        <div class="flex items-center gap-2">
            <span class="text-sm text-gray-600">Размер:</span>
            <input type="range" id="brushSize" min="1" max="50" value="3" onchange="updateBrushSize()" class="w-32">
            <span class="text-sm text-gray-600" id="sizeValue">3px</span>
        </div>

        <div class="border-l border-gray-200 h-6 mx-2"></div>

        <!-- Действия -->
        <button onclick="undo()" class="toolbar-btn rounded" title="Отменить">
            <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h10a8 8 0 018 8v2M3 10l6 6m-6-6l6-6"/>
            </svg>
        </button>
        <button onclick="clearCanvas()" class="toolbar-btn rounded" title="Очистить">
            <svg class="h-5 w-5 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
            </svg>
        </button>
        <button onclick="saveCanvas()" class="toolbar-btn rounded" title="Сохранить">
            <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1-4l-1-1H9L8 3M4 7h16"/>
            </svg>
        </button>
    </div>

    <!-- Canvas -->
    <canvas id="canvas" class="block"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let isDrawing = false;
        let startX, startY;
        let currentTool = 'pen';
        let currentColor = '#000000';
        let brushSize = 3;
        let undoStack = [];
        let maxUndo = 50;

        // Инициализация canvas
        function initCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight - 110;
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            saveState();
        }

        // Обновление размера canvas при изменении окна
        window.addEventListener('resize', () => {
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight - 110;
            ctx.putImageData(imageData, 0, 0);
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
        });

        // Сохранение состояния для undo
        function saveState() {
            undoStack.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
            if (undoStack.length > maxUndo) {
                undoStack.shift();
            }
        }

        // Отмена последнего действия
        function undo() {
            if (undoStack.length > 1) {
                undoStack.pop();
                const imageData = undoStack[undoStack.length - 1];
                ctx.putImageData(imageData, 0, 0);
            }
        }

        // Выбор инструмента
        function setTool(tool) {
            currentTool = tool;
            document.querySelectorAll('.toolbar-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            const toolMap = {
                pen: 'penTool',
                eraser: 'eraserTool',
                line: 'lineTool',
                rectangle: 'rectangleTool',
                circle: 'circleTool',
                text: 'textTool'
            };
            document.getElementById(toolMap[tool]).classList.add('active');
            canvas.style.cursor = tool === 'text' ? 'text' : 'crosshair';
        }

        // Выбор цвета
        function setColor(color) {
            currentColor = color;
            document.querySelectorAll('.color-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.style.backgroundColor === color) {
                    btn.classList.add('active');
                }
            });
        }

        // Обновление размера кисти
        function updateBrushSize() {
            brushSize = document.getElementById('brushSize').value;
            document.getElementById('sizeValue').textContent = brushSize + 'px';
        }

        // Начало рисования
        canvas.addEventListener('mousedown', (e) => {
            isDrawing = true;
            startX = e.offsetX;
            startY = e.offsetY;

            if (currentTool === 'text') {
                const text = prompt('Введите текст:');
                if (text) {
                    ctx.fillStyle = currentColor;
                    ctx.font = `${brushSize * 4}px Inter, sans-serif`;
                    ctx.fillText(text, startX, startY);
                    saveState();
                }
                isDrawing = false;
                return;
            }

            if (currentTool !== 'pen' && currentTool !== 'eraser') {
                saveState();
            }

            ctx.beginPath();
            ctx.moveTo(startX, startY);
        });

        // Рисование
        canvas.addEventListener('mousemove', (e) => {
            if (!isDrawing) return;

            const currentX = e.offsetX;
            const currentY = e.offsetY;

            ctx.lineWidth = brushSize;
            ctx.strokeStyle = currentTool === 'eraser' ? '#ffffff' : currentColor;

            if (currentTool === 'pen' || currentTool === 'eraser') {
                ctx.lineTo(currentX, currentY);
                ctx.stroke();
            } else if (currentTool === 'line') {
                // Перерисовываем canvas
                const imageData = undoStack[undoStack.length - 1];
                ctx.putImageData(imageData, 0, 0);

                ctx.beginPath();
                ctx.moveTo(startX, startY);
                ctx.lineTo(currentX, currentY);
                ctx.stroke();
            } else if (currentTool === 'rectangle') {
                // Перерисовываем canvas
                const imageData = undoStack[undoStack.length - 1];
                ctx.putImageData(imageData, 0, 0);

                const width = currentX - startX;
                const height = currentY - startY;
                ctx.strokeRect(startX, startY, width, height);
            } else if (currentTool === 'circle') {
                // Перерисовываем canvas
                const imageData = undoStack[undoStack.length - 1];
                ctx.putImageData(imageData, 0, 0);

                const radius = Math.sqrt(Math.pow(currentX - startX, 2) + Math.pow(currentY - startY, 2));
                ctx.beginPath();
                ctx.arc(startX, startY, radius, 0, Math.PI * 2);
                ctx.stroke();
            }
        });

        // Окончание рисования
        canvas.addEventListener('mouseup', () => {
            if (isDrawing && currentTool !== 'pen' && currentTool !== 'eraser') {
                saveState();
            }
            isDrawing = false;
        });

        // Очистка canvas
        function clearCanvas() {
            if (confirm('Очистить доску?')) {
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                saveState();
            }
        }

        // Сохранение canvas как изображения
        function saveCanvas() {
            const link = document.createElement('a');
            link.download = 'drawing.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        // Инициализация
        initCanvas();
    </script>
</body>
</html>
