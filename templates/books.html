<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Библиотека - TeachApp</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .card-hover {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .card-hover:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
        }
        .star-rating {
            color: #fbbf24;
        }
        .modal-overlay {
            backdrop-filter: blur(5px);
        }
    </style>
</head>
<body class="bg-gray-50">
    <!-- Навигация -->
    <nav class="bg-white/90 backdrop-blur-lg shadow-lg sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <div class="gradient-bg rounded-lg p-2">
                        <svg class="h-6 w-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/>
                        </svg>
                    </div>
                    <span class="ml-3 text-xl font-bold text-gray-900">TeachApp</span>
                </div>
                <div class="flex items-center space-x-2">
                    <a href="/" class="text-gray-700 hover:text-blue-600 px-4 py-2 rounded-lg text-sm font-medium transition-colors">Dashboard</a>
                    <a href="/books" class="bg-blue-50 text-blue-700 px-4 py-2 rounded-lg text-sm font-semibold">Библиотека</a>
                    <a href="/files" class="text-gray-700 hover:text-blue-600 px-4 py-2 rounded-lg text-sm font-medium transition-colors">Файлы</a>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto py-8 px-4 sm:px-6 lg:px-8">
        <!-- Hero секция -->
        <div class="gradient-bg rounded-2xl p-8 mb-8 text-white shadow-xl">
            <div class="flex justify-between items-center">
                <div>
                    <h1 class="text-4xl font-bold mb-2">Библиотека</h1>
                    <p class="text-white/90 text-lg">Управление учебными материалами и книгами</p>
                </div>
                <button onclick="showAddBookModal()" class="bg-white text-gray-900 px-6 py-3 rounded-xl hover:bg-gray-100 transition-all transform hover:scale-105 flex items-center font-semibold shadow-lg">
                    <svg class="h-5 w-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
                    </svg>
                    Добавить книгу
                </button>
            </div>
        </div>

        <!-- Поиск и фильтры -->
        <div class="mb-8 flex gap-4">
            <div class="flex-1 max-w-md relative">
                <svg class="h-5 w-5 text-gray-400 absolute left-3 top-1/2 transform -translate-y-1/2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                </svg>
                <input type="text" id="searchInput" oninput="searchBooks()" placeholder="Поиск книг по названию или описанию..." class="w-full pl-10 pr-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 bg-white shadow-sm">
            </div>
            <button onclick="sortByRating()" class="px-4 py-3 bg-white border border-gray-200 rounded-xl hover:bg-gray-50 transition-colors flex items-center shadow-sm">
                <svg class="h-5 w-5 mr-2 text-yellow-500" fill="currentColor" viewBox="0 0 20 20">
                    <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/>
                </svg>
                По рейтингу
            </button>
        </div>

        <!-- Список книг -->
        <div id="booksList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Книги будут загружены через JavaScript -->
        </div>

        <!-- Пустое состояние -->
        <div id="emptyState" class="hidden text-center py-16">
            <svg class="h-24 w-24 text-gray-300 mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/>
            </svg>
            <h3 class="text-xl font-semibold text-gray-700 mb-2">Книги не найдены</h3>
            <p class="text-gray-500">Добавьте первую книгу в библиотеку</p>
        </div>
    </main>

    <!-- Модальное окно добавления книги -->
    <div id="addBookModal" class="hidden fixed inset-0 bg-black bg-opacity-50 modal-overlay flex items-center justify-center z-50">
        <div class="bg-white rounded-2xl p-8 w-full max-w-lg shadow-2xl">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold text-gray-900">Добавить книгу</h2>
                <button onclick="hideAddBookModal()" class="text-gray-400 hover:text-gray-600">
                    <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                    </svg>
                </button>
            </div>
            <form id="addBookForm" onsubmit="addBook(event)">
                <div class="mb-5">
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Название книги *</label>
                    <input type="text" name="name" required placeholder="Введите название" class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                </div>
                <div class="mb-5">
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Описание</label>
                    <textarea name="description" rows="3" placeholder="Краткое описание книги" class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500"></textarea>
                </div>
                <div class="mb-5">
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Файл книги *</label>
                    <select name="file_name" required class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 bg-white">
                        <option value="">Выберите файл...</option>
                        <!-- Файлы будут загружены через JavaScript -->
                    </select>
                    <div class="mt-2 text-sm text-gray-500 flex items-center">
                        <svg class="h-4 w-4 mr-1 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                        </svg>
                        Если файла нет, <a href="/files" class="text-blue-600 hover:text-blue-700 font-medium ml-1">загрузите его</a>
                    </div>
                </div>
                <div class="mb-6">
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Рейтинг (1-10)</label>
                    <div class="flex items-center gap-2">
                        <input type="number" name="grade" min="1" max="10" placeholder="Оценка" class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                        <span class="text-yellow-500 text-2xl">★</span>
                    </div>
                </div>
                <div class="flex justify-end space-x-3">
                    <button type="button" onclick="hideAddBookModal()" class="px-6 py-3 border border-gray-200 rounded-xl hover:bg-gray-50 font-medium transition-colors">Отмена</button>
                    <button type="submit" class="px-6 py-3 gradient-bg text-white rounded-xl hover:opacity-90 font-semibold transition-all transform hover:scale-105">Сохранить</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Загрузка книг
        async function loadBooks() {
            try {
                const response = await fetch('/books');
                const books = await response.json();
                displayBooks(books);
            } catch (error) {
                console.error('Error loading books:', error);
            }
        }

        // Загрузка файлов для select
        async function loadFilesForSelect() {
            try {
                const response = await fetch('/files/list');
                const files = await response.json();
                const select = document.querySelector('select[name="file_name"]');

                // Сохраняем текущее значение
                const currentValue = select.value;

                // Очищаем select
                select.innerHTML = '<option value="">Выберите файл...</option>';

                // Добавляем файлы
                files.forEach(function(file) {
                    const option = document.createElement('option');
                    option.value = file.name;
                    option.textContent = file.name + ' (' + (file.size / 1024).toFixed(2) + ' KB)';
                    select.appendChild(option);
                });

                // Восстанавливаем значение
                if (currentValue) {
                    select.value = currentValue;
                }
            } catch (error) {
                console.error('Error loading files:', error);
            }
        }

        // Отображение книг
        function displayBooks(books) {
            const booksList = document.getElementById('booksList');
            const emptyState = document.getElementById('emptyState');
            booksList.innerHTML = '';

            if (books.length === 0) {
                emptyState.classList.remove('hidden');
                return;
            }

            emptyState.classList.add('hidden');

            books.forEach(function(book) {
                const bookCard = document.createElement('div');
                bookCard.className = 'bg-white rounded-2xl shadow-lg p-6 card-hover cursor-pointer';

                // Рейтинг звездами
                let starsHtml = '';
                if (book.grade) {
                    const rating = Math.min(Math.max(book.grade, 0), 10);
                    const fullStars = Math.floor(rating / 2);
                    const halfStar = rating % 2 >= 1;

                    starsHtml = '<div class="flex items-center gap-1">';
                    for (let i = 0; i < 5; i++) {
                        if (i < fullStars) {
                            starsHtml += '<span class="text-yellow-500">★</span>';
                        } else if (i === fullStars && halfStar) {
                            starsHtml += '<span class="text-yellow-500">⯨</span>';
                        } else {
                            starsHtml += '<span class="text-gray-300">★</span>';
                        }
                    }
                    starsHtml += '<span class="ml-2 text-sm font-semibold text-gray-700">' + book.grade + '/10</span>';
                    starsHtml += '</div>';
                }

                bookCard.innerHTML = `
                    <div class="flex items-start justify-between mb-4">
                        <div class="flex-1">
                            <h3 class="text-xl font-bold text-gray-900 mb-2">${book.name}</h3>
                            ${starsHtml}
                        </div>
                        <button onclick="deleteBook('${book.name}')" class="text-gray-400 hover:text-red-600 transition-colors p-2 hover:bg-red-50 rounded-lg">
                            <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                            </svg>
                        </button>
                    </div>
                    ${book.description ? `<p class="text-gray-600 mb-4 line-clamp-3">${book.description}</p>` : ''}
                    <div class="flex items-center justify-between pt-4 border-t border-gray-100">
                        ${book.file_name ? `<a href="/files/download/${book.file_name}" class="inline-flex items-center text-blue-600 hover:text-blue-700 font-medium">
                            <svg class="h-4 w-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z"/>
                            </svg>
                            Читать
                        </a>` : '<span class="text-gray-400 text-sm">Файл не указан</span>'}
                        <span class="text-xs text-gray-400">ID: ${book.id}</span>
                    </div>
                `;
                booksList.appendChild(bookCard);
            });
        }

        // Сортировка по рейтингу
        let sortAscending = true;
        async function sortByRating() {
            try {
                const response = await fetch('/books');
                let books = await response.json();
                books.sort((a, b) => {
                    const ratingA = a.grade || 0;
                    const ratingB = b.grade || 0;
                    return sortAscending ? ratingA - ratingB : ratingB - ratingA;
                });
                sortAscending = !sortAscending;
                displayBooks(books);
            } catch (error) {
                console.error('Error sorting books:', error);
            }
        }

        // Поиск книг
        async function searchBooks() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            try {
                const response = await fetch('/books');
                const books = await response.json();
                const filtered = books.filter(function(book) {
                    return book.name.toLowerCase().includes(searchTerm) ||
                           (book.description && book.description.toLowerCase().includes(searchTerm));
                });
                displayBooks(filtered);
            } catch (error) {
                console.error('Error searching books:', error);
            }
        }

        // Показать модальное окно
        function showAddBookModal() {
            loadFilesForSelect(); // Загружаем файлы при открытии
            document.getElementById('addBookModal').classList.remove('hidden');
        }

        // Скрыть модальное окно
        function hideAddBookModal() {
            document.getElementById('addBookModal').classList.add('hidden');
        }

        // Добавление книги
        async function addBook(event) {
            event.preventDefault();
            const form = event.target;
            const formData = new FormData(form);
            const bookData = Object.fromEntries(formData.entries());

            // Валидация
            if (!bookData.name || !bookData.file_name) {
                alert('Заполните обязательные поля: название и файл');
                return;
            }

            if (bookData.grade && (bookData.grade < 1 || bookData.grade > 10)) {
                alert('Рейтинг должен быть от 1 до 10');
                return;
            }

            try {
                const response = await fetch('/book', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(bookData)
                });

                if (response.ok) {
                    hideAddBookModal();
                    form.reset();
                    loadBooks();
                } else {
                    const error = await response.json();
                    alert('Ошибка: ' + error.detail);
                }
            } catch (error) {
                console.error('Error adding book:', error);
                alert('Ошибка при добавлении книги');
            }
        }

        // Удаление книги
        async function deleteBook(name) {
            if (confirm('Вы уверены, что хотите удалить книгу "' + name + '"?')) {
                try {
                    const response = await fetch('/book/' + name, {
                        method: 'DELETE'
                    });

                    if (response.ok) {
                        loadBooks();
                    } else {
                        const error = await response.json();
                        alert('Ошибка: ' + error.detail);
                    }
                } catch (error) {
                    console.error('Error deleting book:', error);
                    alert('Ошибка при удалении книги');
                }
            }
        }

        // Загрузка при старте
        loadBooks();
        loadFilesForSelect();
    </script>
</body>
</html>
